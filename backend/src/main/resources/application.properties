spring.datasource.username=${SPRING_DATASOURCE_USERNAME:${DB_USERNAME:postgres.iwaskrfqdifskxedtaol}}
spring.datasource.password=${SUPABASE_DB_PASSWORD:${DB_PASSWORD:Wemmbu@!77@^}}
