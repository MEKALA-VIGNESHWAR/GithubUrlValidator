server:
  port: 3000

spring:
  datasource:
    url: jdbc:h2:mem:hackathondb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driverClassName: org.h2.Driver
    username: sa
    password: 
  h2:
    console:
      enabled: true
      settings:
        web-allow-others: true
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  mail:
    host: smtp.mailtrap.io
    port: 2525
    username: ${MAIL_USERNAME:dev_user}
    password: ${MAIL_PASSWORD:dev_password}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
