groups:
  - name: hackforge-production-alerts
    rules:
      - alert: HighHttpErrorRate
        expr: rate(http_server_requests_seconds_count{status=~"5.."}[5m]) / rate(http_server_requests_seconds_count[5m]) > 0.05
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "High HTTP 5xx error rate detected on HackForge (>5%)"
          description: "HTTP 5xx rate is {{ $value | humanizePercentage }} over 5 minutes."

      - alert: HighRequestLatency
        expr: histogram_quantile(0.95, sum(rate(http_server_requests_seconds_bucket[5m])) by (le)) > 1.5
        for: 3m
        labels:
          severity: warning
        annotations:
          summary: "Slow API responses (95th percentile > 1.5s)"
          description: "95th percentile response time is {{ $value }} seconds."

      - alert: DeadLetterQueueNotEmpty
        expr: rabbitmq_queue_messages{queue="hackforge.notifications.dlq"} > 0
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: "Unprocessed messages in HackForge DLQ"
          description: "The notification Dead-Letter Queue contains {{ $value }} failed messages."
