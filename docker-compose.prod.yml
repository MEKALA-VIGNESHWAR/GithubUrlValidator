version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: hackforge_prod_postgres
    restart: always
    environment:
      POSTGRES_DB: ${DB_NAME:-hackforge_prod}
      POSTGRES_USER: ${DB_USERNAME:-hackforge_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-secr3t_prod_db_pass}
    volumes:
      - postgres_prod_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-hackforge_user}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: hackforge_prod_redis
    restart: always
    command: redis-server --requirepass ${REDIS_PASSWORD:-secr3t_redis_pass}
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-secr3t_redis_pass}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: hackforge_prod_rabbitmq
    restart: always
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USERNAME:-hackforge_mq}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-secr3t_mq_pass}
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: hackforge_prod_backend
    restart: always
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_URL: jdbc:postgresql://postgres:5432/${DB_NAME:-hackforge_prod}
      DB_USERNAME: ${DB_USERNAME:-hackforge_user}
      DB_PASSWORD: ${DB_PASSWORD:-secr3t_prod_db_pass}
      JWT_SECRET: ${JWT_SECRET:-8f3c4e1b7d5a3f6e8c9b2a4d7e1f3a5b8c9d2e4f7a1b3c5e8f9a2b4c6d8e0f12}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-9a2f8c4e1b7d5a3f6e8c9b2a4d7e1f3a5b8c9d2e4f7a1b3c5e8f9a2b4c6d8e99}
      REDIS_HOST: redis
      REDIS_PASSWORD: ${REDIS_PASSWORD:-secr3t_redis_pass}
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_USERNAME: ${RABBITMQ_USERNAME:-hackforge_mq}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-secr3t_mq_pass}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: hackforge_prod_frontend
    restart: always
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - backend

volumes:
  postgres_prod_data:
